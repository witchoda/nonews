[project]
name = "nonews"
version = "0.1.0"
description = "Mexican news extraction and analysis system"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "click>=8.1",
    "lxml>=5.0",
    "pysentimiento>=0.7",
]

[project.scripts]
nonews = "nonews.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
